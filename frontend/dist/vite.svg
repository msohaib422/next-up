<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  <g transform="translate(50,50)">
    <!-- Graduation cap -->
    <polygon points="-25,0 0,-15 25,0 0,15" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <rect x="-3" y="2" width="6" height="12" fill="#f59e0b" rx="1"/>
    <circle cx="0" cy="14" r="2" fill="#f59e0b"/>
    <!-- Tassel -->
    <line x1="25" y1="0" x2="30" y2="10" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="30" cy="11" r="2" fill="#f59e0b"/>
  </g>
</svg>
